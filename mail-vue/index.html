<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0f766e" id="theme-color-meta">
  <meta name="application-name" content="Khwarizmi Mail">
  <meta name="apple-mobile-web-app-title" content="Khwarizmi Mail">
  <meta name="description" content="Khwarizmi Mail adalah layanan email resmi untuk alamat @khwarizmi.co.id.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="canonical" href="https://mail.khwarizmi.co.id/">
  <meta property="og:locale" content="id_ID">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Khwarizmi Mail">
  <meta property="og:title" content="Khwarizmi Mail — Email @khwarizmi.co.id">
  <meta property="og:description" content="Layanan email resmi untuk alamat @khwarizmi.co.id.">
  <meta property="og:url" content="https://mail.khwarizmi.co.id/">
  <meta property="og:image" content="https://mail.khwarizmi.co.id/mail-pwa.png">
  <meta property="og:image:alt" content="Logo Khwarizmi Mail">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Khwarizmi Mail — Email @khwarizmi.co.id">
  <meta name="twitter:description" content="Layanan email resmi untuk alamat @khwarizmi.co.id.">
  <meta name="twitter:image" content="https://mail.khwarizmi.co.id/mail-pwa.png">
  <title>Khwarizmi Mail — Email @khwarizmi.co.id</title>
  <link rel="icon" href="/mail.png" type="image/png">
  <link rel="apple-touch-icon" href="/mail-pwa.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    const uiStoreStr =  localStorage.getItem('ui')
    if (uiStoreStr) {
      const uiStore =  JSON.parse(uiStoreStr)
      const root = document.documentElement
      root.setAttribute('class', uiStore.dark ? 'dark' : '');
      const metaTag = document.getElementById('theme-color-meta');
      const isMobile =  !window.matchMedia("(pointer: fine) and (hover: hover)").matches;
      metaTag.setAttribute('content', uiStore.dark ? '#062d2c' : '#0f766e');
    }
  </script>
</head>
<style>
  html {
    background: #FFFFFF;
  }
  .dark {
    background: #141414;
  }
  #loading-first {
    position: fixed;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
    background: var(--el-bg-color);
  }

  .loading-hide {
    pointer-events: none;
    opacity: 0;
  }

  .loading-icon {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .loading-image {
    width: 70px;
    height: 70px;
    object-fit: contain;
  }

  .loading-progress {
    position: relative;
    width: 64px;
    height: 4px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(15, 118, 110, 0.18);
  }

  .loading-progress::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: #0f766e;
    transform: scaleX(0);
    transform-origin: left center;
    animation: loading-progress-grow 2.4s linear forwards;
  }

  .loading-progress::after {
    content: "";
    position: absolute;
    top: 0;
    width: 24px;
    height: 100%;
    border-radius: inherit;
    background: rgba(244, 107, 44, 0.55);
    filter: blur(4px);
    transform: translateX(-24px);
    animation: loading-progress-peg 2.4s linear forwards;
  }

  .loading-complete .loading-progress::before {
    animation: none;
    transform: scaleX(1);
    transition: transform 200ms linear;
  }

  .loading-complete .loading-progress::after {
    animation: none;
    transform: translateX(60px);
    transition: transform 200ms linear;
  }

  @keyframes loading-progress-grow {
    0% {
      transform: scaleX(0);
    }
    100% {
      transform: scaleX(1);
    }
  }

  @keyframes loading-progress-peg {
    0% {
      transform: translateX(-24px);
    }
    100% {
      transform: translateX(60px);
    }
  }
</style>
<body>
<div id="loading-first" >
  <div class="loading-icon">
    <img class="loading-image" src="/mail-pwa.png" alt="Khwarizmi Mail">
    <div class="loading-progress" aria-hidden="true"></div>
  </div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
