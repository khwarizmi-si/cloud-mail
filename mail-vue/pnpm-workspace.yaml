# pnpm 10+ reads settings from here, not from the "pnpm" field in package.json.
# Without allowBuilds, `pnpm install` exits non-zero with ERR_PNPM_IGNORED_BUILDS on a
# clean checkout, which breaks the wrangler [build] command and therefore deploys.
#
# `packages` is required by pnpm 9 (used by the GitHub Actions workflow), which
# refuses to install against a workspace file without it.
packages:
  - .

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
