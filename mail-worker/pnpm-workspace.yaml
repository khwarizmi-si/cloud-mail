# pnpm 10+ reads settings from here, not from the "pnpm" field in package.json.
# workerd ships its runtime binary via a postinstall script, so wrangler cannot build
# or deploy without it. Unapproved build scripts also make `pnpm install` exit
# non-zero, which fails the build on a clean checkout (Cloudflare Workers Builds, CI).
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
