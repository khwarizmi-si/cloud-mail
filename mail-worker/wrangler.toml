name = "cloud-mail"
account_id = "1ef2e18dc9de53cb201f3ca19b77bebb"
workers_dev = true
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "379e0ba1-804a-45a6-afd9-ce3ce0df40e3"

[[kv_namespaces]]
binding = "kv"
id = "3a7edc037d8245ef90e084995993a3c2"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail"

# Resend is configured per sending domain in System Settings.
# Keep the Cloudflare binding disabled so Resend is selected.
# [[send_email]]
# name = "email"

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[[routes]]
pattern = "mail.khwarizmi.co.id/*"
zone_id = "982b42f882bccf9b7d513e8270e1a856"

[triggers]
crons = ["0 16 * * *"]	#每天晚上12点执行每日任务,刷新分析缓存


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
domain = ["khwarizmi.co.id"]
admin = "admin@khwarizmi.co.id"

[build]
# Installs deps only when they are missing, so this works both locally (node_modules
# already present, pnpm may not even be installed) and on a clean checkout such as
# Cloudflare Workers Builds. corepack ships with Node, so pnpm need not be global.
# The test -f guard matters: without it a missing index.html makes grep exit 2, which
# the leading ! flips to success, letting a failed build deploy.
command = "cd ../mail-vue && { [ -x node_modules/.bin/vite ] || corepack pnpm install --frozen-lockfile; } && node_modules/.bin/vite build --mode release && test -f ../mail-worker/dist/index.html && ! grep -q '/src/main.js' ../mail-worker/dist/index.html"
